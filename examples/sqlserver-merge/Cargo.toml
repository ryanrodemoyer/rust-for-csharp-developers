[package]
name = "sqlserver-merge"
version = "0.1.0"
edition = "2024"
description = "A terse, educational Rust CLI demonstrating SQL Server connection, table creation, idempotent MERGE upsert, and SELECT querying"

[dependencies]
tiberius = { version = "0.13", default-features = false, features = ["rustls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
tokio-util = { version = "0.7", features = ["compat"] }
anyhow = "1.0"
clap = { version = "4", features = ["derive"] }
